command:
  - python
  - main.py

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: app-warehouse
  - name: UC_VOLUME
    valueFrom: toyota-volume
  - name: VECTOR_SEARCH_ENDPOINT
    value: toyota-rag-search
  - name: DEFAULT_INDEX_NAME
    valueFrom: baseline-index
  - name: DEFAULT_LLM_ENDPOINT
    valueFrom: default-llm
  - name: PREP_JOB_ID
    valueFrom: prep-job
  - name: EVAL_JOB_ID
    valueFrom: eval-job
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: mlflow-experiment
  - name: MLFLOW_TRACKING_URI
    value: databricks
  - name: MLFLOW_TRACING_SQL_WAREHOUSE_ID
    valueFrom: app-warehouse

# Catalog and Schema are derived from the fully qualified Volume/Index binding;
# no user-specific resource name is stored in this deployable source. Resource
# IDs are supplied by Databricks App resource bindings. The
# browser-facing Workspace URL is supplied by ``${workspace.host}`` in
# ``databricks.yml``; when that override is not used, the App falls back to the
# Databricks-provided ``DATABRICKS_HOST`` value.
